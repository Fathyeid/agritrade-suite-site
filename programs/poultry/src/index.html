<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poultry Intelligence Platform</title>
<style>
:root{--bg:#f3f8fe;--card:#fff;--pri:#0b5cab;--pri2:#e8f2fc;--sky:#38a3f5;--gold:#c9a227;--gold2:#fff6d6;--tx:#14263b;--mu:#5f7389;--bd:#dce7f2;--ok:#1b8a4b;--wr:#d98a00;--er:#c0392b;--r:16px;--sh:0 2px 10px rgba(11,60,117,.07)}
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-inline-end:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}.brand .lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0b5cab,#38a3f5);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.brand b{display:block;font-size:16px;color:var(--pri)}.brand small{color:var(--mu);font-size:12px}
.grp{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--mu);padding:12px 10px 4px;text-transform:uppercase}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;cursor:pointer;color:#27415b;font-weight:600;font-size:14px;white-space:nowrap}.side a i{font-style:normal;width:22px;text-align:center}
.side a:hover{background:var(--pri2)}.side a.on{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(11,92,171,.25)}
.mainc{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:25;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 18px;flex-wrap:wrap}
.top .burger{display:none}.top .crumb{font-size:13px;color:var(--mu)}.top .crumb b{color:var(--tx)}
.gs{position:relative;flex:1;min-width:160px;max-width:420px}.gs input{padding:9px 12px 9px 34px;border-radius:999px;background:var(--bg)}[dir=rtl] .gs input{padding:9px 34px 9px 12px}
.gs .ic{position:absolute;inset-inline-start:12px;top:9px;color:var(--mu)}
#gsres{position:absolute;inset-inline:0;top:44px;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 30px rgba(11,60,117,.15);max-height:340px;overflow:auto;display:none;z-index:40}
#gsres div{padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:14px}#gsres div:hover{background:var(--pri2)}#gsres small{color:var(--mu)}
.top .tm{font-size:13px;color:var(--mu);white-space:nowrap}
.bell{position:relative}.bell .n{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--er);color:#fff;border-radius:10px;font-size:11px;padding:0 5px;min-width:17px;text-align:center}
#notif{position:absolute;inset-inline-end:0;top:44px;width:min(360px,86vw);background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 30px rgba(11,60,117,.15);padding:10px;display:none;z-index:40;max-height:60vh;overflow:auto}
.user{display:flex;align-items:center;gap:8px;font-size:13px}.user .av{width:32px;height:32px;border-radius:50%;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-weight:700}
main{padding:18px;max-width:1300px;width:100%;margin:0 auto}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;min-height:38px}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--bd)}.btn.gold{background:var(--gold);color:#2b2200}.btn.red{background:#fbe0dc;color:var(--er)}.btn.sm{padding:4px 10px;font-size:12px;min-height:28px;border-radius:8px}
.top .btn.ghost{padding:6px 11px}
.grid{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.kpi{position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--sky),var(--pri))}
.kpi .v{font-size:26px;font-weight:700;color:var(--pri)}.kpi .l{color:var(--mu);font-size:13px}.kpi .s{font-size:12px;color:var(--mu);margin-top:3px}
h2{font-size:20px;margin:4px 0 10px}h3{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}th,td{padding:9px 10px;border-bottom:1px solid #edf3f9;text-align:start;white-space:nowrap}th{background:#f2f7fc;color:#234;position:sticky;top:0;z-index:1;font-weight:700;user-select:none}th.srt{cursor:pointer}th.srt:hover{background:var(--pri2)}tbody tr:hover td,tr:hover>td{background:#fafcff}
th[data-s="1"]:after{content:" ▲";font-size:10px}th[data-s="-1"]:after{content:" ▼";font-size:10px}.tw{overflow:auto;max-height:70vh;border-radius:10px}
.tt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.tt input{max-width:240px;padding:6px 10px;border-radius:999px;background:var(--bg)}.tt small{color:var(--mu)}
.pg{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:13px;color:var(--mu)}
.muted{color:var(--mu)}.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--pri2);color:var(--pri)}
.tag.ok{background:#dff3e7;color:var(--ok)}.tag.wr{background:#fff0cf;color:#8a5a00}.tag.er{background:#fbe0dc;color:var(--er)}.tag.test{background:#ffe8a3;color:#6b4e00;font-weight:700}
.alert{padding:10px 13px;border-radius:12px;margin:6px 0;font-size:14px;border:1px solid transparent}.alert.wr{background:var(--gold2);border-color:#f1dc93}.alert.er{background:#fdeceb;border-color:#f3c3be}.alert.ok{background:#e6f6ec;border-color:#bfe5cd}.alert.in{background:var(--pri2);border-color:#cfe2f5}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mod{border-inline-start:4px solid var(--bd)}.mod.live{border-color:var(--ok)}.mod.part{border-color:var(--wr)}
.modal{position:fixed;inset:0;background:rgba(20,50,90,.35);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:60}
.modal .box{background:#fff;border-radius:18px;padding:20px;width:min(580px,100%);box-shadow:0 20px 50px rgba(11,60,117,.25)}
label{display:block;font-size:13px;color:var(--mu);margin:9px 0 3px;font-weight:600}input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;color:var(--tx);min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc9f3;border-color:var(--sky)}
input[type=checkbox]{width:auto;min-height:0}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{background:linear-gradient(120deg,#0b5cab,#2b8be0 60%,#6cc0ff);color:#fff;border-radius:20px;padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset-inline-end:-40px;bottom:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.center{max-width:520px;margin:60px auto;text-align:center}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--bd);box-shadow:0 10px 30px rgba(11,60,117,.2);padding:10px 18px;border-radius:12px;z-index:80;font-weight:600}
svg text{font-family:inherit}
.sk{background:linear-gradient(90deg,#edf3f9,#f8fbff,#edf3f9);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:90px;margin:10px 0}@keyframes sk{to{background-position:-200% 0}}
@media(max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.side{position:fixed;inset-block:0;inset-inline-start:0;width:270px;transform:translateX(-105%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.2)}[dir=rtl] .side{transform:translateX(105%)}.shell.open .side{transform:none}.top .burger{display:inline-block}.top .tm,.top .crumb{display:none}}
@media(max-width:600px){.row2{grid-template-columns:1fr}.two{grid-template-columns:1fr}main{padding:12px}.btn{min-height:42px}.top{padding:8px 12px}.user span{display:none}}
.grid.two,.grid.three{}
@media(max-width:700px){.grid.two,.grid.three{grid-template-columns:1fr!important}.grid>*{min-width:0}}
@media print{.side,.top,.btn,.tt,.pg{display:none!important}.shell{display:block}body{background:#fff}.card{break-inside:avoid;box-shadow:none}.tw{max-height:none}}
.hero2{background-size:cover;background-position:center;border-radius:20px;color:#fff;padding:26px;margin-bottom:14px;position:relative;min-height:170px;display:flex;align-items:flex-end;box-shadow:0 8px 24px rgba(11,92,171,.18)}.hero2 h2{margin:2px 0 4px;font-size:26px;color:#fff}.hero2 p{margin:0 0 12px;opacity:.95}.hero2 .cr{position:absolute;inset-inline-end:12px;top:8px;opacity:.75;font-size:10px}.qa{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #cfe0f5;background:#fff;color:#0b5cab;border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}.chip.on{background:#0b5cab;color:#fff;border-color:#0b5cab}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.lgd{display:flex;align-items:center;gap:8px;margin:4px 0}.lgd i{width:12px;height:12px;border-radius:4px;display:inline-block}.gg{text-align:center}
.act{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef3fa}.act i{font-style:normal;background:#eaf3ff;border-radius:10px;padding:6px}.act span{flex:1}.act small{color:#6b7f99}.empty{text-align:center;color:#6b7f99;padding:24px;background:#f6faff;border-radius:12px}
.toast.ok{border-color:#2e9e5b;color:#1d7a44}.toast.err{border-color:#c0392b;color:#a32d20}.bad{border-color:#c0392b!important;background:#fff5f4}.fgrid.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fgrid .fc:has(input[type=checkbox]){grid-column:1/-1}.modal .box:has(.fgrid.two){width:min(760px,100%)}@media(max-width:700px){.fgrid.two{grid-template-columns:1fr}}.btn.red{background:#c0392b;color:#fff}

function pcalc(p){
  const recs=S.data.pdaily.filter(r=>r.pflock_id===p.id).sort((a,b)=>a.rec_date<b.rec_date?-1:1);
  let liveF=p.females,live7=[];recs.forEach(r=>{liveF-=r.mortality_f;r._live=liveF});
  const from=addDays(today(),-6),w=recs.filter(r=>r.rec_date>=from);
  const eggs=w.reduce((s,r)=>s+r.eggs_total,0),hen=w.reduce((s,r)=>s+r._live,0),he=w.reduce((s,r)=>s+r.hatching_eggs,0),feed=w.reduce((s,r)=>s+Number(r.feed_kg),0);
  return{p,recs,liveF,ageW:Math.floor(dayDiff(p.placed_on,today())/7),hd:hen?eggs/hen*100:null,hep:eggs?he/eggs*100:null,fg:hen?feed*1000/hen:null,today:recs.find(r=>r.rec_date===today())}}
function hcalc(h){const inf=h.infertile,hat=h.hatched;const fert=inf!=null?(h.eggs_set-inf)/h.eggs_set*100:null;
  return{h,fert,hof:hat!=null&&inf!=null&&h.eggs_set>inf?hat/(h.eggs_set-inf)*100:null,hos:hat!=null?hat/h.eggs_set*100:null,sale:hat!=null?hat-(h.culls||0):null}}
function hatchRate(){const hs=S.data.hatches.filter(h=>h.hatched!=null);const e=hs.reduce((s,h)=>s+h.eggs_set,0);return e?hs.reduce((s,h)=>s+h.hatched,0)/e*100:null}

  const pg=document.createElement('div');pg.className='pg';tw.after(pg);
  const num=s=>{const x=parseFloat(String(s).replace(/[,%\s]/g,''));return isNaN(x)?null:x};
  [...head.cells].forEach((th,ci)=>{if(!th.textContent.trim())return;th.classList.add('srt');th.onclick=()=>{st.dir=st.col===ci?-st.dir:1;st.col=ci;rows.sort((a,b)=>{const x=a.cells[ci]?a.cells[ci].textContent.trim():'',y=b.cells[ci]?b.cells[ci].textContent.trim():'',nx=num(x),ny=num(y);return(nx!==null&&ny!==null?nx-ny:x.localeCompare(y))*st.dir});rows.forEach(r=>body.appendChild(r));[...head.cells].forEach(c=>c.removeAttribute('data-s'));th.setAttribute('data-s',st.dir);st.p=0;ap()}});
  function ap(){const f=rows.filter(r=>!st.q||r.textContent.toLowerCase().includes(st.q));const pages=Math.max(1,Math.ceil(f.length/st.ps));st.p=Math.min(st.p,pages-1);rows.forEach(r=>r.style.display='none');f.slice(st.p*st.ps,(st.p+1)*st.ps).forEach(r=>r.style.display='');cnt.textContent=f.length+' '+t('t_rows')+(f.length===0?' · '+t('t_nomatch'):'');
   pg.innerHTML=pages>1?`<button class="btn sm ghost" ${st.p?'':'disabled'}>${t('t_prev')}</button><span>${t('t_page')} ${st.p+1} / ${pages}</span><button class="btn sm ghost" ${st.p<pages-1?'':'disabled'}>${t('t_next')}</button>`:'';if(pages>1){const b=pg.querySelectorAll('button');b[0].onclick=()=>{st.p--;ap()};b[1].onclick=()=>{st.p++;ap()}}}
  ap()})}

function draw(){
  const ar=LANG==='ar';document.documentElement.lang=LANG;document.documentElement.dir=ar?'rtl':'ltr';document.title=t('app');
  const open=S.modal&&document.activeElement&&S.modal.drawn;
  let h='';
  if(!S.user){h=`<main><div class="center card"><div class="brand" style="justify-content:center"><div class="lg">A</div><div style="text-align:start"><b>Agritrade Pro</b><small>${t('brand_mod')}</small></div></div><h2>${t('welcome')}</h2><p class="muted">${t('welcome2')}</p>${S.busy?`<div class="sk"></div>`:`<button class="btn gold" data-a="signin">${t('signin')}</button> <button class="btn ghost" data-a="lang">${t('lang')}</button>`}</div></main>`}
  else if(!S.role){h=`<main><div class="center card"><h2>${t('noaccess')}</h2><p>${t('noaccess2')}</p><b>${esc(S.user.email)}</b><div class="bar" style="justify-content:center"><button class="btn ghost" data-a="signout">${t('signout')}</button></div></div></main>`}
  else if(S.busy&&!S.data){h=`<main><div class="center"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></main>`}
  else if(S.err){h=`<main><div class="center card">${t('loaderr')}<br><small>${esc(S.err)}</small></div></main>`}
  else{h=shellHtml(({dash:vDash,flocks:vFlocks,flock:vFlock,sites:vSites,stock:vStock,vet:vVet,sales:vSales,fin:vFin,hatch:vHatch,fleet:vFleet,trace:vTrace,layers:vLayers,cold:vCold,ledger:vLedger,reports:vReports,plan:vPlan,ai:vAi,mods:vMods,users:vUsers,audit:vAudit,set:vSet}[S.route]||vDash)())}
  if(S.modal){h+=`<div class="modal"><div class="box"><h2>${esc(S.modal.title)}</h2><div class="fgrid ${S.modal.fields.length>5?'two':''}">${S.modal.fields.map(fld).join('')}</div>${S.modal.note?`<p class="muted" style="font-size:12px">${esc(S.modal.note)}</p>`:''}<div class="bar" style="margin-top:14px"><button class="btn" data-a="msave">${t('save')}</button><button class="btn ghost" style="color:#0b5cab" data-a="mcancel">${t('cancel')}</button></div></div></div>`}
  document.getElementById('app').innerHTML=h;if(S.user&&S.role&&S.data)enhance()}
init();draw();
</script></body></html>
