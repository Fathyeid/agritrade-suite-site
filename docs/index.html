<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agritrade Pro</title>
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="/ds/ds.css">
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-card">
    <div class="logo">🌾</div>
    <h1 data-i="title"></h1>
    <p data-i="loginSub"></p>
    <button id="gbtn" class="gbtn"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span data-i="google"></span></button>
    <div id="lerr" class="err"></div>
    <button class="lang-mini" data-lang-toggle></button>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="top">
    <button id="menu" class="icon" aria-label="menu">☰</button>
    <div class="brand" id="brand"><span class="bl">🌾</span><b>Agritrade <i>Pro</i></b></div>
    <div class="gsr" id="gsr"><span class="gsi">🔍</span><input id="gsq" type="search" autocomplete="off"><div id="gsres" class="gsres hidden"></div></div>
    <div class="grow"></div>
    <button id="openfull" class="pill hidden" data-i="openFull"></button>
    <button class="pill" data-lang-toggle></button>
    <div class="bellw"><button id="bell" class="bell" aria-label="notifications">🔔<span id="bellc" class="bellc hidden"></span></button><div id="bellm" class="bellm hidden"></div></div>
    <div class="user" id="uchip"><span id="uav" class="uav"></span><span class="un"><b id="uname"></b><small id="ubadge"></small></span><span class="uch">⌄</span><div id="umenu" class="umenu hidden"><div id="uemail"></div><button id="logout" class="pill" data-i="logout"></button></div></div>
  </header>
  <div class="shade" id="shade"></div>
  <aside class="sidew" id="sidew"><div class="slogo"><span>🌾</span><b>Agritrade<br><i>Pro</i></b></div><nav class="side" id="side"></nav><div class="pcard"><span id="pav" class="uav big"></span><div><b id="pname"></b><small id="prole"></small></div><button id="logout2" class="plo">⎋ <span data-i="logout"></span></button></div></aside>
  <main id="main">
    <section id="home" class="home"></section>
    <section id="frameWrap" class="frameWrap hidden">
      <div id="blocked" class="blocked hidden"></div>
      <div id="fnote" class="fnote hidden"></div>
      <iframe id="frame" title="module" allow="clipboard-write; fullscreen; geolocation"></iframe>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="hub.js"></script>
<script src="app.js"></script>
</body>
</html>
