<script>
'use strict';
const KEY='iom.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=(n,d=2)=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d});
const today=()=>new Date().toISOString().slice(0,10);
const BU={Soybeans:36.7437,Wheat:36.7437,Corn:39.368,Barley:45.9296};
let S=load(),ROLE=localStorage.getItem('iom.role')||'General Manager',PAGE='overview',ARG=null;

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return s}catch(e){}return fresh(true)}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function fresh(demo){
 const s={v:1,seq:{RCV:0,PRD:0,WGH:0,B:0,L:0,ADJ:0,TRF:0,OPN:0,F:0,W:0},commodities:[],warehouses:[],batches:[],ledger:[],receipts:[],tickets:[],formulas:[],orders:[],audit:[],demo:!!demo};
 [['Soybeans','raw'],['Wheat','raw'],['Corn','raw'],['Barley','raw'],['Sunflower Seeds','raw'],['Soybean Meal','finished'],['Soybean Oil','finished'],['Soybean Hulls','byproduct'],['Wheat Flour','finished'],['Wheat Bran','byproduct']].forEach(([n,k],i)=>s.commodities.push({id:'C'+(i+1),name:n,kind:k}));
 if(demo)seed(s);return s}
function seed(s){
 const C=n=>s.commodities.find(c=>c.name===n).id,d=x=>{const t=new Date();t.setDate(t.getDate()-x);return t.toISOString().slice(0,10)};
 const W=(code,name,type,cap,al)=>{s.warehouses.push({id:'W'+(++s.seq.W),code,name,type,factory:'Factory 1',cap,cells:type==='Silo'?4:1,allowed:al.map(C),demo:1})};
 W('SILO-A','Silo A (raw)','Silo',20000,['Soybeans','Corn','Wheat']);
 W('WH-1','Warehouse 1','Warehouse',8000,['Wheat','Barley','Corn','Soybean Meal','Soybean Hulls']);
 W('MEAL-1','Meal store','Production Storage',6000,['Soybean Meal']);
 W('TANK-1','Soy oil tank','Tank',1500,['Soybean Oil']);
 W('HULL-1','Hulls yard','Open Yard',1000,['Soybean Hulls']);
 s.formulas=[{id:'F1',name:'Soybean Crushing',raw:C('Soybeans'),line:'Line 1',loss:0,outs:[{c:C('Soybean Meal'),p:73},{c:C('Soybean Oil'),p:20},{c:C('Soybean Hulls'),p:7}],stages:['Raw Material Preparation','Cleaning','Dehulling','Crushing','Extraction','Refining','Packaging','Final Product Storage'],demo:1},
 {id:'F2',name:'Wheat Milling',raw:C('Wheat'),line:'Mill 1',loss:1,outs:[{c:C('Wheat Flour'),p:74},{c:C('Wheat Bran'),p:25}],stages:['Raw Material Preparation','Cleaning','Milling','Packaging','Final Product Storage'],demo:1}];s.seq.F=2;
 const rc=(imp,ves,sup,com,org,bl,dis,rec,wh,days)=>{const ref='RCV-'+String(++s.seq.RCV).padStart(4,'0');const n=++s.seq.B;
  const b={id:'B'+n,no:'BATCH-'+String(n).padStart(3,'0'),c:C(com),origin:org,src:'receipt',srcRef:ref,parents:[],date:d(days),demo:1};s.batches.push(b);
  s.receipts.push({ref,imp,vessel:ves,supplier:sup,c:C(com),origin:org,bl,dis,rec,wh,date:d(days),status:'approved',batch:b.id,demo:1});
  s.ledger.push({id:'L'+(++s.seq.L),ts:d(days)+'T09:00:00',type:'RECEIPT',doc:ref,wh,batch:b.id,qty:rec,by:'demo'})};
 rc('IMP-DEMO-01','MV Demo Star','Demo Grain Co.','Soybeans','Brazil',5000,4985,4980,'W1',20);
 rc('IMP-DEMO-02','MV Demo Pearl','Demo Trading Ltd','Soybeans','USA',3000,2995,2990,'W1',12);
 rc('IMP-DEMO-03','MV Demo Wave','Black Sea Demo','Wheat','Ukraine',2000,1998,1995,'W2',9);
 s.tickets=[{no:'WGH-0001',truck:'T-4421',driver:'Ahmed S.',gross:41200,tare:14100,net:27100,time:d(1)+'T10:20:00',dir:'In',ref:'RCV-0002',wh:'W1',c:C('Soybeans')}];s.seq.WGH=1;
 s.audit.push({ts:new Date().toISOString(),user:'system',act:'Demo data loaded',ref:''})}
function nref(p){S.seq[p]=(S.seq[p]||0)+1;return p+'-'+String(S.seq[p]).padStart(4,'0')}
function log(act,ref){S.audit.unshift({ts:new Date().toISOString(),user:ROLE,act,ref:ref||''})}
const com=id=>S.commodities.find(c=>c.id===id)||{name:'?',kind:'raw'};
const wh=id=>S.warehouses.find(w=>w.id===id)||{name:'?',code:'?',allowed:[]};
const batch=id=>S.batches.find(b=>b.id===id)||{no:'?',parents:[]};
function stockMap(extra){const m={};S.ledger.concat(extra||[]).forEach(l=>{const k=l.wh+'|'+l.batch;m[k]=(m[k]||0)+l.qty});return m}
const whStock=(w,m)=>Object.entries(m||stockMap()).filter(([k])=>k.startsWith(w+'|')).reduce((a,[,v])=>a+v,0);
function post(entries,doc){

function toMT(q,u,c){if(u==='kg')return q/1000;if(u==='bu')return q/(BU[com(c).name]||36.7437);return q}
function newBatch(c,origin,src,srcRef,parents){const n=++S.seq.B;const b={id:'B'+n,no:'BATCH-'+String(n).padStart(3,'0'),c,origin:origin||'',src,srcRef,parents,date:today()};S.batches.push(b);return b}
function stockOp(t){
 const fl=[];if(t==='ADJ')fl.push({k:'kind',l:'Kind',t:'select',o:[['ADJ','Adjustment (+/-)'],['DAMAGE','Damaged stock'],['LOSS','Storage loss']]});
 fl.push({k:'wh',l:'Warehouse',t:'select',o:wOpts()});
 if(t==='OPENING'){fl.push({k:'c',l:'Commodity',t:'select',o:cOpts()},{k:'origin',l:'Origin'})}else fl.push({k:'b',l:'Batch',t:'select',o:bOpts()});
 fl.push({k:'qty',l:t==='OPENING'?'Quantity':'Quantity (+ adds, - removes; damage and loss always remove)',t:'number',req:1},{k:'unit',l:'Unit',t:'select',o:['MT','kg','bu']},{k:'why',l:'Reason',req:1,w:1});
 modal(t==='OPENING'?'Opening balance':'Stock adjustment',fl,v=>{
  if(!can('stock'))throw new Error('Not permitted for role '+ROLE);
  let q=toMT(+v.qty,v.unit,t==='OPENING'?v.c:batch(v.b).c);
  if(t==='OPENING'){allowedCheck(v.wh,v.c);const doc=nref('OPN');const b=newBatch(v.c,v.origin,'opening',doc,[]);try{post([{type:'OPENING',wh:v.wh,batch:b.id,qty:q}],doc)}catch(e){S.batches.pop();S.seq.B--;throw e}log('Opening balance '+f2(q)+' MT: '+v.why,doc)}
  else{if(v.kind!=='ADJ')q=-Math.abs(q);const doc=nref('ADJ');post([{type:v.kind,wh:v.wh,batch:v.b,qty:q,why:v.why}],doc);log(v.kind+' '+f2(q)+' MT: '+v.why,doc)}})}
function transfer(){modal('Internal transfer between warehouses',[{k:'b',l:'Batch',t:'select',o:bOpts()},{k:'from',l:'From',t:'select',o:wOpts()},{k:'to',l:'To',t:'select',o:wOpts()},{k:'qty',l:'Quantity (MT)',t:'number',req:1}],v=>{
  if(!can('stock'))throw new Error('Not permitted for role '+ROLE);
  if(v.from===v.to)throw new Error('Source and destination must differ');const q=+v.qty;if(!(q>0))throw new Error('Quantity must be positive');
  allowedCheck(v.to,batch(v.b).c);const doc=nref('TRF');post([{type:'TRANSFER_OUT',wh:v.from,batch:v.b,qty:-q},{type:'TRANSFER_IN',wh:v.to,batch:v.b,qty:q}],doc);log('Transfer '+f2(q)+' MT',doc)})}

 table([{h:'Ref',k:'ref'},{h:'Import ref',k:'imp'},{h:'Vessel',k:'vessel'},{h:'Supplier',k:'supplier'},{h:'Commodity',f:r=>esc(com(r.c).name)},{h:'Origin',k:'origin'},{h:'B/L MT',n:1,f:r=>f2(r.bl)},{h:'Discharged',n:1,f:r=>f2(r.dis)},{h:'Received',n:1,f:r=>f2(r.rec)},{h:'B/L minus received',n:1,f:r=>f2(r.bl-r.rec)},{h:'Weighbridge net MT',n:1,f:r=>f2(S.tickets.filter(t=>t.ref===r.ref).reduce((a,t)=>a+t.net/1000,0),3)},{h:'To',f:r=>esc(wh(r.wh).code)},{h:'Date',k:'date'},{h:'Status',f:r=>tag(r.status)},
 {h:'',f:r=>(r.status==='draft'&&can('approveRcv')?'<button class="s p" onclick="apprRcv(\''+r.ref+'\')">Approve & post</button>':'')+(r.status==='approved'&&can('approveRcv')?'<button class="s d" onclick="revDoc(\''+r.ref+'\')">Reverse</button>':'')+(r.batch&&r.status!=='draft'?' <button class="s" onclick="go(\'trace\',\''+r.batch+'\')">Trace</button>':'')}],S.receipts.slice().reverse(),{csv:'receipts'});
function newRcv(){modal('New receiving record',[{k:'imp',l:'Import Transaction reference',req:1},{k:'vessel',l:'Vessel name'},{k:'supplier',l:'Supplier',req:1},{k:'c',l:'Commodity',t:'select',o:cOpts(['raw'])},{k:'origin',l:'Origin'},{k:'wh',l:'Destination warehouse',t:'select',o:wOpts()},{k:'bl',l:'B/L quantity (MT)',t:'number',req:1},{k:'dis',l:'Discharged quantity (MT)',t:'number',req:1},{k:'rec',l:'Received quantity (MT)',t:'number',req:1},{k:'cost',l:'Purchase cost per MT (optional, for costing)',t:'number'},{k:'date',l:'Receiving date',t:'date',v:today()}],v=>{

function apprRcv(ref){tryDo(()=>{if(!can('approveRcv'))throw new Error('Approval needs Warehouse Manager or General Manager');const r=S.receipts.find(x=>x.ref===ref);

 try{post([{type:'RECEIPT',wh:r.wh,batch:b.id,qty:r.rec}],ref)}catch(e){S.batches.pop();S.seq.B--;throw e}
 r.batch=b.id;r.status='approved';log('Receipt approved: '+f2(r.rec)+' MT '+com(r.c).name+' to '+wh(r.wh).code,ref);toast('Posted. '+b.no)})}

 modal(id?'Edit formula':'New formula',[{k:'name',l:'Formula name',v:F.name,req:1},{k:'raw',l:'Raw material',t:'select',o:cOpts(['raw']),v:F.raw},{k:'line',l:'Production line',v:F.line},{k:'loss',l:'Expected process loss %',t:'number',v:F.loss},{k:'std',l:'Standard conversion cost per MT input (optional)',t:'number',v:F.stdConv||''},
 {k:'outs',l:'Outputs: Product = % ; Product = %   (e.g. Soybean Meal = 73 ; Soybean Oil = 20)',w:1,v:F.outs.map(o=>com(o.c).name+' = '+o.p).join(' ; ')},{k:'stages',l:'Stages (separated by ;)',w:1,v:F.stages.join(' ; ')}],v=>{
  if(!can('formula'))throw new Error('Not permitted for role '+ROLE);
  const outs=v.outs.split(/[;\n]/).map(x=>x.trim()).filter(Boolean).map(x=>{const q=x.split('=').map(s=>s.trim()),n=q[0];let c=S.commodities.find(c=>c.name.toLowerCase()===n.toLowerCase());if(!c){c={id:'C'+(S.commodities.length+1),name:n,kind:'finished'};S.commodities.push(c)}return{c:c.id,p:+q[1]}});
  if(!outs.length||outs.some(o=>!(o.p>=0)))throw new Error('Outputs must look like: Name = 73 ; Name = 20');
  const tot=outs.reduce((a,o)=>a+o.p,0)+(+v.loss||0);if(Math.abs(tot-100)>1e-6)throw new Error('Outputs + process loss must equal 100% (now '+tot+'%)');

P.production=()=>'<div class="row" style="margin-bottom:12px"><button class="p" '+(can('produce')?'':'disabled')+' onclick="newOrder()">+ New production order</button></div>'+
 table([{h:'Order',k:'ref'},{h:'Factory / line',f:o=>esc(o.factory+' / '+o.line)},{h:'Formula',f:o=>esc((S.formulas.find(f=>f.id===o.formula)||{}).name)},{h:'Source',f:o=>esc(wh(o.wh).code+' / '+batch(o.batch).no)},{h:'Planned in MT',n:1,f:o=>f2(o.planIn)},{h:'Actual in',n:1,f:o=>o.actIn?f2(o.actIn):'-'},{h:'Yield %',n:1,f:o=>o.actIn&&o.status!=='planned'&&o.status!=='in_progress'?f2(o.outs.reduce((a,x)=>a+x.act,0)/o.actIn*100,1):'-'},{h:'Stage',f:o=>esc(o.stages[o.stage]||'')},{h:'Date',k:'date'},{h:'Manager',k:'mgr'},{h:'Status',f:o=>tag(o.status)},
 {h:'',f:o=>{let b='<button class="s" onclick="orderView(\''+o.ref+'\')">Open</button> ';if(o.status==='planned'&&can('produce'))b+='<button class="s p" onclick="startOrder(\''+o.ref+'\')">Start</button>';if(o.status==='in_progress'&&can('produce'))b+='<button class="s" onclick="nextStage(\''+o.ref+'\')">Next stage</button> <button class="s p" onclick="finishOrder(\''+o.ref+'\')">Record actuals</button>';if(o.status==='completed'&&can('approveProd'))b+='<button class="s p" onclick="approveOrder(\''+o.ref+'\')">Approve & post</button>';if(o.status==='approved'&&can('approveProd'))b+='<button class="s d" onclick="revDoc(\''+o.ref+'\')">Reverse</button>';return b}}],S.orders.slice().reverse(),{csv:'production-orders'});
function newOrder(){if(!S.formulas.length)return toast('Create a formula first',1);const m=stockMap();
 const rsv=reservedMap();const src=Object.keys(m).filter(k=>m[k]-(rsv[k]||0)>0).map(k=>{const p=k.split('|');return[k,wh(p[0]).code+' / '+batch(p[1]).no+' / '+com(batch(p[1]).c).name+' ('+f2(m[k]-(rsv[k]||0))+' MT available)']});
 if(!src.length)return toast('No stock available to produce from',1);
 modal('New production order',[{k:'factory',l:'Factory',v:'Factory 1'},{k:'formula',l:'Formula (sets raw material and line)',t:'select',o:S.formulas.map(f=>[f.id,f.name])},{k:'src',l:'Raw material source (warehouse / batch)',t:'select',o:src,w:1},{k:'qty',l:'Planned input quantity (MT)',t:'number',req:1},{k:'date',l:'Production date',t:'date',v:today()},{k:'end',l:'Expected completion',t:'date',v:today()},{k:'mgr',l:'Production manager',req:1,w:1}],v=>{
  if(!can('produce'))throw new Error('Not permitted for role '+ROLE);
  const F=S.formulas.find(f=>f.id===v.formula),p=v.src.split('|'),w=p[0],b=p[1];if(batch(b).c!==F.raw)throw new Error('Selected batch is '+com(batch(b).c).name+' but the formula needs '+com(F.raw).name);
  if(!(+v.qty>0)||+v.qty>(m[v.src]||0))throw new Error('Planned input must be positive and within available stock ('+f2(m[v.src])+' MT)');
  S.orders.push({ref:nref('PRD'),factory:v.factory,line:F.line,formula:F.id,wh:w,batch:b,planIn:+v.qty,date:v.date,end:v.end,mgr:v.mgr,status:'planned',stages:F.stages.slice(),stage:0,outs:F.outs.map(o=>({c:o.c,p:o.p,exp:+v.qty*o.p/100,act:0,wh:''})),actIn:0,loss:0,wip:0,lossWhy:''});log('Production order created',S.orders[S.orders.length-1].ref)})}
function startOrder(r){tryDo(()=>{if(!can('produce'))throw new Error('Not permitted');S.orders.find(x=>x.ref===r).status='in_progress';log('Production started',r)})}
function nextStage(r){tryDo(()=>{const o=S.orders.find(x=>x.ref===r);if(o.stage<o.stages.length-1)o.stage++;log('Stage: '+o.stages[o.stage],r)})}
function finishOrder(r){const o=S.orders.find(x=>x.ref===r);
 const defW=c=>{const w=S.warehouses.find(w=>w.allowed.includes(c))||S.warehouses.find(w=>!w.allowed.length)||S.warehouses[0];return w&&w.id};
 const fl=[{k:'in',l:'Actual raw material consumed (MT)',t:'number',v:o.planIn,w:1}];
 o.outs.forEach((x,i)=>{fl.push({k:'a'+i,l:com(x.c).name+' actual MT (expected '+f2(x.exp,3)+')',t:'number',v:+x.exp.toFixed(3)},{k:'w'+i,l:'Store in',t:'select',o:wOpts(),v:defW(x.c)})});
 fl.push({k:'wip',l:'Remaining work in process (MT)',t:'number',v:0},{k:'loss',l:'Process loss (MT), recorded not assumed',t:'number',v:0},{k:'why',l:'Reason for any difference or loss',w:1});
 modal('Actual production '+r,fl,v=>{
  const ain=+v.in,outs=o.outs.map((x,i)=>Object.assign({},x,{act:+v['a'+i],wh:v['w'+i]}));
  outs.forEach(x=>{if(x.act>0)allowedCheck(x.wh,x.c)});
  const tot=outs.reduce((a,x)=>a+x.act,0)+(+v.wip)+(+v.loss),diff=ain-tot;
  if(Math.abs(diff)>0.0005&&!v.why.trim())throw new Error('Mass balance differs by '+f2(diff,3)+' MT (input = outputs + losses + WIP). Adjust the figures or write the reason.');
  Object.assign(o,{actIn:ain,outs,wip:+v.wip,loss:+v.loss+(Math.abs(diff)>0.0005?diff:0),lossWhy:v.why,status:'completed'});log('Actuals recorded, awaiting approval',r)})}
function approveOrder(r){tryDo(()=>{if(!can('approveProd'))throw new Error('Approval needs Production Manager or General Manager');const o=S.orders.find(x=>x.ref===r);
 const nb=[],es=[{type:'ISSUE',wh:o.wh,batch:o.batch,qty:-o.actIn}],seqB=S.seq.B;
 o.outs.forEach(x=>{if(x.act<=0)return;const b=newBatch(x.c,batch(o.batch).origin,'production',r,[o.batch]);nb.push(b);x.batch=b.id;es.push({type:'PROD_IN',wh:x.wh,batch:b.id,qty:x.act})});
 try{post(es,r)}catch(e){S.batches.splice(S.batches.length-nb.length,nb.length);S.seq.B=seqB;nb.forEach(()=>{});o.outs.forEach(x=>delete x.batch);throw e}
 o.status='approved';log('Production approved: '+f2(o.actIn)+' MT in, '+nb.length+' output batches',r);toast('Posted: '+nb.map(b=>b.no).join(', '))})}
function orderView(r){const o=S.orders.find(x=>x.ref===r),out=o.outs.reduce((a,x)=>a+x.act,0);
 const m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target===m)m.remove()};
 m.innerHTML='<div class="card"><h3>'+r+' '+tag(o.status)+'</h3><p>Input: planned '+f2(o.planIn)+' MT, actual '+(o.actIn?f2(o.actIn):'-')+' MT. Source '+esc(wh(o.wh).code)+' / '+esc(batch(o.batch).no)+'</p><div class="tw"><table><tr><th>Output</th><th class=num>Yield %</th><th class=num>Expected</th><th class=num>Actual</th><th class=num>Variance</th><th>Batch</th></tr>'+o.outs.map(x=>'<tr><td>'+esc(com(x.c).name)+'</td><td class=num>'+x.p+'</td><td class=num>'+f2(x.exp,3)+'</td><td class=num>'+(x.act?f2(x.act,3):'-')+'</td><td class=num>'+(x.act?f2(x.act-x.exp,3):'-')+'</td><td>'+(x.batch?'<a class="l" onclick="this.closest(\'.modal\').remove();go(\'trace\',\''+x.batch+'\')">'+esc(batch(x.batch).no)+'</a>':'-')+'</td></tr>').join('')+'</table></div>'+
 (o.actIn?'<h3 style="margin-top:14px">Mass balance</h3><p>Input '+f2(o.actIn,3)+' = outputs '+f2(out,3)+' + losses '+f2(o.loss,3)+' + WIP '+f2(o.wip,3)+' (difference '+f2(o.actIn-out-o.loss-o.wip,3)+' MT)<br>Efficiency '+f2(out/o.actIn*100,2)+'% · production loss '+f2(o.loss,3)+' MT'+(o.lossWhy?'<br>Reason: '+esc(o.lossWhy):'')+'</p>':'')+
 '<p class="mut">Stages: '+o.stages.map((s,i)=>i<=o.stage&&o.status!=='planned'?'<b style="color:var(--g)">'+esc(s)+'</b>':esc(s)).join(' › ')+'</p><div class="row" style="justify-content:flex-end"><button onclick="this.closest(\'.modal\').remove()">Close</button></div></div>';document.body.appendChild(m)}

 return table([{h:'Batch',f:r=>esc(batch(r.b).no)},{h:'Product',f:r=>esc(com(batch(r.b).c).name)},{h:'Type',f:r=>tag(com(batch(r.b).c).kind)},{h:'Warehouse',f:r=>esc(wh(r.w).code)},{h:'Production order',f:r=>esc(batch(r.b).srcRef)},{h:'Date',f:r=>esc(batch(r.b).date)},{h:'Stock MT',n:1,f:r=>f2(r.v,3)},{h:'',f:r=>'<button class="s" onclick="go(\'trace\',\''+r.b+'\')">Trace to origin</button>'}],rows,{csv:'finished-goods'})+'<p class="mut">Sales, reservations and dispatch of finished goods come in Stage 2.</p>'};

function rootBatches(b,seen){seen=seen||new Set();const x=S.batches.find(z=>z.id===b);if(!x||seen.has(b))return[];seen.add(b);return x.parents.length?x.parents.flatMap(p=>rootBatches(p,seen)):[b]}
P.trace=()=>{const sel='<div class="card"><label>Select a batch (every received shipment is a batch)<select onchange="go(\'trace\',this.value)"><option value="">-</option>'+S.batches.map(b=>'<option value="'+b.id+'"'+(ARG===b.id?' selected':'')+'>'+esc(b.no)+' · '+esc(com(b.c).name)+' · '+esc(b.srcRef)+'</option>').join('')+'</select></label></div>';
 if(!ARG)return sel+'<p class="mut">Pick a batch to see: Import, Receiving, Warehouse, Production, Finished goods.</p>';
 const roots=[...new Set(rootBatches(ARG))];
 return sel+'<div style="margin-top:14px">'+(roots.indexOf(ARG)<0?'<p class="mut">Origin of this batch: '+roots.map(r=>'<a class="l" onclick="go(\'trace\',\''+r+'\')">'+esc(batch(r).no)+'</a>').join(', ')+'</p>':'')+roots.map(r=>treeOf(r)).join('')+'<p class="mut" style="margin-top:14px">Costs and profitability per shipment come with Stage 3 (costing).</p></div>'};
function treeOf(id){const b=batch(id),m=stockMap();const loc=Object.keys(m).filter(k=>k.endsWith('|'+id)&&Math.abs(m[k])>1e-9);
 const rc=S.receipts.find(r=>r.batch===id&&r.status!=='draft');const cons=S.ledger.filter(l=>l.batch===id&&l.type==='ISSUE'&&!l.reversed);const kids=S.batches.filter(x=>x.parents.indexOf(id)>=0);
 const recQty=S.ledger.filter(l=>l.batch===id&&['RECEIPT','OPENING','PROD_IN'].indexOf(l.type)>=0&&!l.reversed).reduce((a,l)=>a+l.qty,0);
 let h='<div class="card nd"><b>'+esc(b.no)+'</b> '+esc(com(b.c).name)+' <span class="mut">'+esc(b.origin||'')+'</span> '+tag(b.src)+'<div class="mut">';
 if(rc)h+='Import '+esc(rc.imp)+' · vessel '+esc(rc.vessel||'-')+' · supplier '+esc(rc.supplier)+' · B/L '+f2(rc.bl)+' MT · discharged '+f2(rc.dis)+' · received '+f2(rc.rec)+' MT on '+esc(rc.date)+' ('+esc(rc.ref)+')<br>';
 else if(b.src==='production')h+='Produced by '+esc(b.srcRef)+' · '+f2(recQty,3)+' MT<br>';
 else h+='Source '+esc(b.srcRef)+' · '+f2(recQty,3)+' MT<br>';
 h+='In stock: '+(loc.map(k=>esc(wh(k.split('|')[0]).code)+' '+f2(m[k],3)+' MT').join(', ')||'0');
 if(cons.length)h+='<br>Consumed in production: '+f2(-cons.reduce((a,l)=>a+l.qty,0),3)+' MT ('+[...new Set(cons.map(l=>l.doc))].join(', ')+')';

 const dl=S.deliveries.filter(d=>d.batch===id&&d.status==='approved');
 if(dl.length){h+='<br>Sold / delivered: '+dl.map(d=>{const s=so(d.so),iv=S.invoices.filter(i=>i.del===d.ref);const val=iv.reduce((a,i)=>a+i.total,0),paid=iv.reduce((a,i)=>a+invPaid(i.no)*1,0);return esc(d.ref)+' ('+esc(cust(s.cust).name)+') '+f2(d.delivered,3)+' MT (loaded '+f2(d.loaded,3)+') · invoices '+(iv.map(i=>esc(i.no)).join(', ')||'none')+' = '+f2(val)+' '+esc(s.cur)+' · collected '+f2(paid)+' · outstanding '+f2(val-paid)}).join('<br>')}
 const mv=S.moves.filter(m=>m.batch===id&&m.status==='received');if(mv.length)h+='<br>Internal moves: '+mv.map(m=>esc(m.ref)+' '+esc(wh(m.from).code)+' to '+esc(wh(m.to).code)+' '+f2(m.recv,3)+' MT').join(', ');
 h+='</div>';if(kids.length)h+='<div class="tree">'+kids.map(k=>treeOf(k.id)).join('')+'</div>';return h+'</div>'}

 table([{h:'Time',f:a=>esc(a.ts.slice(0,19).replace('T',' '))},{h:'User / role',k:'user'},{h:'Action',k:'act'},{h:'Ref',k:'ref'}],S.audit,{csv:'audit'});

/* ===== Stage 2: sales, reservations, dispatch, invoices, collections, fleet, movements ===== */
function ensure(){['customers','sales','deliveries','invoices','collections','vehicles','moves'].forEach(k=>{if(!S[k])S[k]=[]});['SO','DLV','INV','COL','MOV','CUS','VEH'].forEach(k=>{if(S.seq[k]==null)S.seq[k]=0})}
ensure();
const cust=id=>S.customers.find(c=>c.id===id)||{name:'?'};
const so=r=>S.sales.find(s=>s.ref===r)||{};
const days=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function dispatched(r){return S.deliveries.filter(d=>d.so===r&&d.status!=='reversed').reduce((a,d)=>a+d.loaded,0)}
function reservedMap(){const m={};S.sales.filter(s=>s.status==='approved'&&s.src).forEach(s=>{const rem=s.qty-dispatched(s.ref);if(rem>0)m[s.src]=(m[s.src]||0)+rem});return m}
function invPaid(no){return S.collections.filter(c=>c.status!=='reversed').reduce((a,c)=>a+c.alloc.filter(x=>x.inv===no).reduce((x,y)=>x+y.amt,0),0)}
function invOut(i){return Math.max(0,i.total-invPaid(i.no))}
function invStatus(i){const o=invOut(i);return o<0.005?'paid':(invPaid(i.no)>0?'partial':'unpaid')}
const overdue=i=>invOut(i)>0.005&&i.due<today();
function custAcct(cid,cur){const inv=S.invoices.filter(i=>i.cust===cid&&i.cur===cur);const sales=S.sales.filter(s=>s.cust===cid&&s.cur===cur&&s.status!=='cancelled'&&s.status!=='draft').reduce((a,s)=>a+s.qty*s.price,0);
 const invd=inv.reduce((a,i)=>a+i.total,0),col=S.collections.filter(c=>c.cust===cid&&c.cur===cur&&c.status!=='reversed').reduce((a,c)=>a+c.amount,0);
 return{sales,invd,col,out:inv.reduce((a,i)=>a+invOut(i),0),over:inv.filter(overdue).reduce((a,i)=>a+invOut(i),0),unapplied:col-inv.reduce((a,i)=>a+invPaid(i.no),0)}}
const availOpts=()=>{const m=stockMap(),r=reservedMap();return Object.keys(m).filter(k=>m[k]-(r[k]||0)>1e-9).map(k=>{const p=k.split('|');return[k,wh(p[0]).code+' / '+batch(p[1]).no+' / '+com(batch(p[1]).c).name+' (avail '+f2(m[k]-(r[k]||0),3)+' MT)']})};

P.sales=()=>'<div class="row" style="margin-bottom:12px"><button class="p" '+(can('sales')?'':'disabled')+' onclick="newSO()">+ New sales order</button><button '+(can('sales')||can('finance')?'':'disabled')+' onclick="newCust()">+ New customer</button></div>'+
 '<div class="card" style="margin-bottom:14px"><h3>Available to sell</h3>'+(()=>{const m=stockMap(),r=reservedMap();const by={};Object.keys(m).forEach(k=>{const c=com(batch(k.split('|')[1]).c).name;by[c]=by[c]||{p:0,r:0};by[c].p+=m[k];by[c].r+=r[k]||0});
 const prod=S.orders.filter(o=>['in_progress','completed'].includes(o.status));const inc=S.receipts.filter(x=>x.status==='draft');
 return '<div class="tw"><table><tr><th>Commodity</th><th class=num>Physical</th><th class=num>Reserved</th><th class=num>Available</th></tr>'+Object.keys(by).filter(c=>by[c].p>1e-9).map(c=>'<tr><td>'+esc(c)+'</td><td class=num>'+f2(by[c].p,3)+'</td><td class=num>'+f2(by[c].r,3)+'</td><td class=num><b>'+f2(by[c].p-by[c].r,3)+'</b></td></tr>').join('')+'</table></div><p class="mut">In production: '+f2(prod.reduce((a,o)=>a+o.planIn,0))+' MT · incoming (receipts awaiting approval): '+f2(inc.reduce((a,x)=>a+x.rec,0))+' MT</p>'})()+'</div>'+
 table([{h:'Order',k:'ref'},{h:'Customer',f:s=>esc(cust(s.cust).name)},{h:'Product',f:s=>esc(com(s.c).name)},{h:'Qty MT',n:1,f:s=>f2(s.qty)},{h:'Price',n:1,f:s=>f2(s.price)+' '+s.cur},{h:'Value',n:1,f:s=>f2(s.qty*s.price)},{h:'Terms',f:s=>esc(s.terms+' / pay '+s.pay+'d')},{h:'Salesperson',k:'rep'},{h:'Date',k:'date'},{h:'Dispatched',n:1,f:s=>f2(dispatched(s.ref),3)},{h:'Source',f:s=>s.src?esc(wh(s.src.split('|')[0]).code+' / '+batch(s.src.split('|')[1]).no):'<span class="mut">future production</span>'},{h:'Status',f:s=>tag(s.status)},
 {h:'',f:s=>(s.status==='draft'&&can('sales')?'<button class="s p" onclick="apprSO(\''+s.ref+'\')">Approve & reserve</button>':'')+(['draft','approved'].includes(s.status)&&can('sales')?'<button class="s d" onclick="cancelSO(\''+s.ref+'\')">Cancel</button>':'')}],S.sales.slice().reverse(),{csv:'sales-orders'})+
 '<h3 style="margin-top:20px">Customer accounts</h3>'+table([{h:'Customer',f:r=>esc(cust(r.c).name)},{h:'Cur',k:'cur'},{h:'Total sales',n:1,f:r=>f2(r.a.sales)},{h:'Invoiced',n:1,f:r=>f2(r.a.invd)},{h:'Collected',n:1,f:r=>f2(r.a.col)},{h:'Outstanding',n:1,f:r=>f2(r.a.out)},{h:'Overdue',n:1,f:r=>r.a.over>0?'<span style="color:var(--red)">'+f2(r.a.over)+'</span>':'0'},{h:'Credit limit',n:1,f:r=>f2(cust(r.c).limit)},{h:'Credit used',f:r=>{const l=cust(r.c).limit;return l?'<div class="bar"><i style="width:'+Math.min(100,r.a.out/l*100)+'%"></i></div>':'-'}}],S.customers.flatMap(c=>[...new Set([c.cur,...S.sales.filter(s=>s.cust===c.id).map(s=>s.cur)])].map(cur=>({c:c.id,cur,a:custAcct(c.id,cur)}))),{csv:'customer-accounts'});
function newSO(){if(!S.customers.length)return toast('Add a customer first',1);
 modal('New sales order',[{k:'cust',l:'Customer',t:'select',o:custOpts()},{k:'src',l:'Sell from (warehouse / batch, available stock)',t:'select',o:availOpts().concat([['','Future production (needs General Manager)']]),w:1},{k:'qty',l:'Quantity (MT)',t:'number',req:1},{k:'price',l:'Unit price per MT',t:'number',req:1},{k:'cur',l:'Currency',t:'select',o:['USD','EGP','EUR']},{k:'terms',l:'Delivery terms',t:'select',o:['EXW','FCA','DAP','CIF','Ex-silo']},{k:'loc',l:'Delivery location'},{k:'pay',l:'Payment terms (days)',t:'number',v:30},{k:'rep',l:'Salesperson',req:1},{k:'date',l:'Order date',t:'date',v:today()},{k:'sched',l:'Delivery schedule (free text)',w:1}],v=>{
  if(!can('sales'))throw new Error('Not permitted for role '+ROLE);
  const q=+v.qty;if(!(q>0&&+v.price>0))throw new Error('Quantity and price must be positive');
  const c=v.src?batch(v.src.split('|')[1]).c:null;
  S.sales.push({ref:nref('SO'),cust:v.cust,c:c,src:v.src,qty:q,price:+v.price,cur:v.cur,terms:v.terms,loc:v.loc,pay:+v.pay,rep:v.rep,date:v.date,sched:v.sched,status:'draft'});log('Sales order drafted',S.sales[S.sales.length-1].ref)});
}
function apprSO(r){tryDo(()=>{if(!can('sales'))throw new Error('Not permitted for role '+ROLE);const s=so(r);
 if(s.src){const m=stockMap(),res=reservedMap();const av=(m[s.src]||0)-(res[s.src]||0);if(s.qty>av+1e-9)throw new Error('Not available: only '+f2(av,3)+' MT available to sell from this batch/warehouse (reserved stock excluded)')}
 else if(ROLES[ROLE]!=='*')throw new Error('Selling against future production needs General Manager approval');
 const c=cust(s.cust);if(c.limit){const a=custAcct(s.cust,s.cur);const exp=a.out+s.qty*s.price;if(exp>c.limit)throw new Error('Credit limit exceeded: exposure '+f2(exp)+' > limit '+f2(c.limit)+' '+s.cur)}
 s.status='approved';log('Sales order approved'+(s.src?' and stock reserved':''),r);toast('Approved'+(s.src?', '+f2(s.qty)+' MT reserved':''))})}
function cancelSO(r){if(!confirm('Cancel '+r+'? Reservation is released.'))return;tryDo(()=>{const s=so(r);if(dispatched(r)>0)throw new Error('Already partly dispatched; cannot cancel');s.status='cancelled';log('Sales order cancelled',r)})}

P.dispatch=()=>'<div class="row" style="margin-bottom:12px"><button class="p" '+(can('dispatch')?'':'disabled')+' onclick="newDlv()">+ New delivery / dispatch</button></div><p class="mut">Stock leaves the warehouse only when a dispatch is approved. Loading weight is deducted; customer-confirmed quantity gives shortage / excess.</p>'+
 table([{h:'Delivery',k:'ref'},{h:'Sales order',k:'so'},{h:'Customer',f:d=>esc(cust(so(d.so).cust).name)},{h:'From',f:d=>esc(wh(d.wh).code+' / '+batch(d.batch).no)},{h:'Truck',k:'truck'},{h:'Driver',k:'driver'},{h:'Exit ticket',k:'ticket'},{h:'Loaded MT',n:1,f:d=>f2(d.loaded,3)},{h:'Delivered MT',n:1,f:d=>f2(d.delivered,3)},{h:'Short / excess',n:1,f:d=>{const x=d.delivered-d.loaded;return x<0?'<span style="color:var(--red)">'+f2(x,3)+'</span>':f2(x,3)}},{h:'Invoiced MT',n:1,f:d=>f2(S.invoices.filter(i=>i.del===d.ref).reduce((a,i)=>a+i.qty,0),3)},{h:'Date',k:'date'},{h:'Status',f:d=>tag(d.status)},{h:'',f:d=>(d.status==='approved'&&can('dispatch')?'<button class="s d" onclick="revDlv(\''+d.ref+'\')">Reverse</button>':'')+' <button class="s" onclick="go(\'trace\',\''+d.batch+'\')">Trace</button>'}],S.deliveries.slice().reverse(),{csv:'deliveries'});
function newDlv(){const open=S.sales.filter(s=>s.status==='approved'&&s.qty-dispatched(s.ref)>1e-9);if(!open.length)return toast('No approved sales orders awaiting dispatch',1);
 modal('Dispatch / delivery',[{k:'so',l:'Sales order',t:'select',o:open.map(s=>[s.ref,s.ref+' · '+cust(s.cust).name+' · remaining '+f2(s.qty-dispatched(s.ref),3)+' MT']),w:1},{k:'src',l:'Load from (only needed for future-production orders)',t:'select',o:[['','Use order source']].concat(Object.keys(stockMap()).filter(k=>stockMap()[k]>0).map(k=>[k,wh(k.split('|')[0]).code+' / '+batch(k.split('|')[1]).no])),w:1},{k:'truck',l:'Truck number',req:1},{k:'driver',l:'Driver',req:1},{k:'tare',l:'Tare weight (kg)',t:'number',req:1,on:'dn()'},{k:'gross',l:'Gross loaded weight (kg) at exit weighbridge',t:'number',req:1,on:'dn()'},{k:'net',l:'Loading weight MT (automatic)',ro:1},{k:'del',l:'Customer-confirmed delivered MT (blank = same as loaded)',t:'number'},{k:'date',l:'Date',t:'date',v:today()}],v=>{
  if(!can('dispatch'))throw new Error('Not permitted for role '+ROLE);
  const s=so(v.so),key=s.src||v.src;if(!key)throw new Error('Choose the batch to load from');const p=key.split('|');
  const loaded=(+v.gross-+v.tare)/1000;if(!(loaded>0))throw new Error('Gross must exceed tare');
  if(loaded>s.qty-dispatched(s.ref)+1e-9)throw new Error('Loading exceeds the order remaining ('+f2(s.qty-dispatched(s.ref),3)+' MT)');
  if(!s.src){const c0=batch(p[1]).c;s.c=s.c||c0}
  const ref=nref('DLV');post([{type:'DISPATCH',wh:p[0],batch:p[1],qty:-loaded}],ref);
  const tk=nref('WGH');S.tickets.push({no:tk,truck:v.truck,driver:v.driver,gross:+v.gross,tare:+v.tare,net:+v.gross-+v.tare,time:new Date().toISOString(),dir:'Out',ref:ref,wh:p[0],c:batch(p[1]).c});
  S.deliveries.push({ref,so:v.so,wh:p[0],batch:p[1],loaded,delivered:v.del===''?loaded:+v.del,truck:v.truck,driver:v.driver,ticket:tk,date:v.date,status:'approved'});
  if(dispatched(v.so)>=s.qty-1e-9)s.status='closed';log('Dispatch '+f2(loaded,3)+' MT for '+v.so,ref)})}
function dn(){const e=document.querySelector('.modal form').elements;e.net.value=Math.max(0,((+e.gross.value||0)-(+e.tare.value||0))/1000)}
function revDlv(r){if(!confirm('Reverse '+r+'?'))return;tryDo(()=>{if(!can('dispatch'))throw new Error('Not permitted');const d=S.deliveries.find(x=>x.ref===r);if(S.invoices.some(i=>i.del===r))throw new Error('Delivery is invoiced; cancel the invoice first (reverse its collections)');
 reverseDoc(r);d.status='reversed';const s=so(d.so);if(s.status==='closed')s.status='approved'})}

P.invoices=()=>'<div class="row" style="margin-bottom:12px"><button class="p" '+(can('finance')?'':'disabled')+' onclick="newInv()">+ New invoice from delivery</button></div>'+
 table([{h:'Invoice',k:'no'},{h:'Customer',f:i=>esc(cust(i.cust).name)},{h:'Delivery',k:'del'},{h:'Product',f:i=>esc(com(i.c).name)},{h:'Qty MT',n:1,f:i=>f2(i.qty,3)},{h:'Unit price',n:1,f:i=>f2(i.price)},{h:'Discount',n:1,f:i=>f2(i.disc)},{h:'Tax %',n:1,f:i=>i.tax},{h:'Total',n:1,f:i=>f2(i.total)+' '+i.cur},{h:'Paid',n:1,f:i=>f2(invPaid(i.no))},{h:'Outstanding',n:1,f:i=>f2(invOut(i))},{h:'Due',f:i=>overdue(i)?'<span style="color:var(--red)">'+i.due+'</span>':i.due},{h:'Status',f:i=>overdue(i)?tag('overdue').replace('t-i','t-b'):tag(invStatus(i))}],S.invoices.slice().reverse(),{csv:'invoices'});
function newInv(){const open=S.deliveries.filter(d=>d.status==='approved'&&d.delivered-S.invoices.filter(i=>i.del===d.ref).reduce((a,i)=>a+i.qty,0)>1e-9);if(!open.length)return toast('No delivered quantity left to invoice',1);
 const left=d=>d.delivered-S.invoices.filter(i=>i.del===d.ref).reduce((a,i)=>a+i.qty,0);
 modal('New sales invoice',[{k:'del',l:'Delivery',t:'select',o:open.map(d=>[d.ref,d.ref+' · '+so(d.so).ref+' · '+cust(so(d.so).cust).name+' · to invoice '+f2(left(d),3)+' MT']),w:1},{k:'qty',l:'Quantity to invoice (MT) - blank = all remaining',t:'number'},{k:'disc',l:'Discount (amount)',t:'number',v:0},{k:'tax',l:'Tax %',t:'number',v:0},{k:'date',l:'Invoice date',t:'date',v:today()}],v=>{
  if(!can('finance'))throw new Error('Not permitted for role '+ROLE);
  const d=S.deliveries.find(x=>x.ref===v.del),s=so(d.so),q=v.qty===''?left(d):+v.qty;if(!(q>0)||q>left(d)+1e-9)throw new Error('Quantity must be within what is still uninvoiced ('+f2(left(d),3)+' MT)');
  const net=q*s.price-(+v.disc||0);if(net<0)throw new Error('Discount exceeds value');const total=net*(1+(+v.tax||0)/100);
  const due=new Date(v.date);due.setDate(due.getDate()+s.pay);
  S.invoices.push({no:nref('INV'),so:s.ref,del:d.ref,cust:s.cust,c:batch(d.batch).c,qty:q,price:s.price,disc:+v.disc||0,tax:+v.tax||0,total:Math.round(total*100)/100,cur:s.cur,due:due.toISOString().slice(0,10),date:v.date});log('Invoice issued '+f2(total)+' '+s.cur,S.invoices[S.invoices.length-1].no)})}

P.collections=()=>{const od=S.invoices.filter(overdue);const bucket=(i,lo,hi)=>{const d=Math.floor((new Date(today())-new Date(i.due))/864e5);return invOut(i)>0.005&&d>=lo&&d<=hi};
 const rows=S.customers.flatMap(c=>[...new Set(S.invoices.filter(i=>i.cust===c.id).map(i=>i.cur))].map(cur=>{const iv=S.invoices.filter(i=>i.cust===c.id&&i.cur===cur);const b=(lo,hi)=>iv.filter(i=>bucket(i,lo,hi)).reduce((a,i)=>a+invOut(i),0);return{c:c.name,cur,cur0:b(-9999,0),b1:b(1,30),b2:b(31,60),b3:b(61,90),b4:b(91,99999)}}));
 return (od.length?'<div class="demo" style="border-color:rgba(255,107,107,.5);color:var(--red);background:rgba(255,107,107,.1)">'+od.length+' overdue invoice(s): '+[...new Set(od.map(i=>cust(i.cust).name))].map(esc).join(', ')+'</div>':'')+

function costOf(o){ // returns breakdown for approved order
 const b=batch(o.batch),rawUnit=b.cost||0,raw=o.actIn*rawUnit;
 const lines={};S.expenses.filter(e=>live(e)&&e.lt==='Production Order'&&e.lr===o.ref).forEach(e=>{lines[e.cat]=(lines[e.cat]||0)+e.amount});
 const conv=Object.values(lines).reduce((a,x)=>a+x,0),total=raw+conv;
 const pol=o.costPol||{method:'weight',prices:[],pct:[]};const outs=o.outs.filter(x=>x.act>0);
 let w;if(pol.method==='value'){const v=outs.map(x=>x.act*(pol.prices[o.outs.indexOf(x)]||0));const t=v.reduce((a,x)=>a+x,0);w=t>0?v.map(x=>x/t):outs.map(x=>x.act/outs.reduce((a,y)=>a+y.act,0))}
 else if(pol.method==='custom'){const p=outs.map(x=>(pol.pct[o.outs.indexOf(x)]||0)/100);w=p}
 else w=outs.map(x=>x.act/outs.reduce((a,y)=>a+y.act,0));
 const alloc=outs.map((x,i)=>({x,cost:total*w[i],unit:x.act?total*w[i]/x.act:0,price:pol.prices[o.outs.indexOf(x)]||0}));
 const F=S.formulas.find(f=>f.id===o.formula)||{};const std=(F.stdConv||0);
 return{raw,rawUnit,lines,conv,total,perMT:o.actIn?total/o.actIn:0,convPerMT:o.actIn?conv/o.actIn:0,std,alloc,pol,margin:alloc.reduce((a,x)=>a+x.x.act*x.price-x.cost,0),hasPrice:alloc.some(x=>x.price>0)}}

 '<h3 style="margin-top:12px">Allocation ('+({weight:'by weight',value:'by sales value',custom:'custom %'})[c.pol.method]+')</h3><div class="tw"><table><tr><th>Product</th><th class=num>Qty MT</th><th class=num>Allocated cost</th><th class=num>Cost / MT</th><th class=num>Sale price / MT</th><th class=num>Margin</th></tr>'+c.alloc.map(a=>'<tr><td>'+esc(com(a.x.c).name)+'</td><td class=num>'+f2(a.x.act,3)+'</td><td class=num>'+f2(a.cost)+'</td><td class=num>'+f2(a.unit,2)+'</td><td class=num>'+(a.price?f2(a.price):'-')+'</td><td class=num>'+(a.price?f2(a.x.act*a.price-a.cost):'-')+'</td></tr>').join('')+'</table></div>'+

async function uploadFile(){
 const f=$('#f_f').files[0];if(!f)return toast('Choose a file',1);if(f.size>20*1024*1024)return toast('File is over 20 MB',1);
 const ext=(f.name.match(/\.[A-Za-z0-9]{1,8}$/)||[''])[0],path=(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random().toString(36).slice(2))+ext;

 const C=[['c_stock','Stock by commodity (MT)'],['c_wh','Warehouse utilization (%)'],['c_whs','Stock by warehouse (MT)'],['c_rcv','Receipts by month (MT)'],['c_prod','Production input vs output by month (MT)'],['c_inv','Invoiced vs collected by month'],['c_rec','Receivables status'],['c_so','Sales orders by status'],['c_dlv','Deliveries by month (MT)'],['c_exp','Expenses by category']];
 return presetBar()+'<div class="grid k2 chgrid" style="margin-top:14px">'+C.map(c=>'<div class="card chc"><h3>'+c[1]+dm+'</h3><div class="chw"><canvas id="'+c[0]+'"></canvas></div></div>').join('')+'</div>'}
function drawCharts(){
 CH.list.forEach(c=>c.destroy());CH.list=[];if(typeof Chart==='undefined')return;
 const cs=getComputedStyle(document.documentElement),mut=cs.getPropertyValue('--mut').trim()||'#777',grid='rgba(120,110,80,.18)';
 const rtl=window.IOM_LANG==='ar';Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;Chart.defaults.color=mut;
 const m=ovStock(),byC={},byW={};
 for(const k in m){const[w,b]=k.split('|');const n=com(batch(b).c).name;byC[n]=(byC[n]||0)+m[k];byW[w]=(byW[w]||0)+m[k]}
 const WL=S.warehouses.filter(w=>!OF.wh||w.id===OF.wh);
 const mo=d=>String(d||'').slice(0,7),monthly=(rows,dt,val)=>{const o={};rows.forEach(r=>{const k=mo(dt(r));if(k)o[k]=(o[k]||0)+val(r)});return o};
 const months=(...objs)=>[...new Set(objs.flatMap(o=>Object.keys(o)))].sort().slice(-6);
 const R=S.receipts.filter(r=>r.status==='approved'&&ovIn(r.date)&&(!OF.wh||r.wh===OF.wh)&&(!OF.com||r.c===OF.com));

 const DL=S.deliveries.filter(d=>ovIn(d.date)&&(!OF.wh||d.wh===OF.wh)&&(!OF.com||batch(d.batch).c===OF.com));
 const EX=S.expenses.filter(e=>e.status!=='reversed'&&ovIn(e.date)&&(!OF.cur||e.cur===OF.cur));
 const sum=a=>a.reduce((x,y)=>x+y,0);
 const mk=(id,type,labels,sets,opt,drl)=>{const el=document.getElementById(id);if(!el)return;const has=sets.some(s=>s.data.some(v=>v>0));
  if(!has||!labels.length){el.parentNode.innerHTML='<div class="mut chempty">No data yet</div>';return}
  const pie=type==='doughnut'||type==='pie';
  sets.forEach((s,i)=>{if(pie)s.backgroundColor=CHCOL;else{s.backgroundColor=s.backgroundColor||CHCOL[i];s.borderColor=s.borderColor||CHCOL[i]}});
  const o=Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:pie||sets.length>1,rtl:rtl,position:pie?'bottom':'top',labels:{boxWidth:12}},tooltip:{rtl:rtl,textDirection:rtl?'rtl':'ltr',callbacks:{label:c=>{const v=c.parsed&&typeof c.parsed==='object'?(c.parsed.y!=null?c.parsed.y:c.parsed.x):c.parsed;const f=f2(v);if(pie){const t=c.dataset.data.reduce((a,b)=>a+b,0);return ' '+c.label+': '+f+' ('+(t?Math.round(v/t*1000)/10:0)+'%)'}const L=c.dataset.label?c.dataset.label+': ':'';return ' '+L+f}}}},animation:{duration:800,easing:'easeOutQuart'},interaction:{mode:pie?'nearest':'index',intersect:pie},onHover:(e,a)=>{if(e.native&&e.native.target)e.native.target.style.cursor=drl&&a.length?'pointer':'default'},onClick:(e,a)=>{if(drl&&a.length)drl(a[0].index,labels[a[0].index])}},pie?{cutout:'58%'}:{scales:{x:{reverse:rtl,grid:{display:false}},y:{position:rtl?'right':'left',beginAtZero:true,grid:{color:grid}}}},opt||{});
  CH.list.push(new Chart(el,{type,data:{labels,datasets:sets},options:o}))};

 mk('c_stock','doughnut',cn.map(CL),[{data:cn.map(k=>byC[k])}],null,i=>drill('inventory',trq(cn[i])));
 mk('c_wh','bar',WL.map(w=>w.code),[{label:CL('Used %'),data:WL.map(w=>w.cap?Math.round(whStock(w.id,m)/w.cap*1000)/10:0),backgroundColor:WL.map(w=>{const p=w.cap?whStock(w.id,m)/w.cap:0;return p>.9?'#b0453f':p>.7?'#e0a12c':'#12874a'})}],{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,max:100,reverse:rtl,grid:{color:grid}},y:{position:rtl?'right':'left',grid:{display:false}}}},i=>drill('inventory','',WL[i].id));
 mk('c_whs','bar',WL.map(w=>w.code),[{label:'MT',data:WL.map(w=>Math.round(whStock(w.id,m)*100)/100)}],null,i=>drill('inventory','',WL[i].id));

 mk('c_prod','line',mm,[{label:CL('Input'),data:mm.map(k=>pi[k]||0),tension:.3},{label:CL('Output'),data:mm.map(k=>po[k]||0),tension:.3}],null,(i,l)=>drill('production',l));
 const iv=monthly(IV,i=>i.date,i=>i.total),cl=monthly(CO,c=>c.date,c=>c.amount);mm=months(iv,cl);
 mk('c_inv','bar',mm,[{label:CL('Invoiced'),data:mm.map(k=>iv[k]||0)},{label:CL('Collected'),data:mm.map(k=>cl[k]||0)}],null,(i,l)=>drill('invoices',l));

 "Receipts by month (MT)": "الاستلام حسب الشهر (طن)", "Production input vs output by month (MT)": "مدخلات ومخرجات الإنتاج حسب الشهر (طن)", "Invoiced vs collected by month": "المفوتر مقابل المحصّل حسب الشهر", "Receivables status": "حالة المستحقات", "Sales orders by status": "أوامر البيع حسب الحالة", "Deliveries by month (MT)": "التسليمات حسب الشهر (طن)", "Expenses by category": "المصروفات حسب الفئة", "Demo": "تجريبي", "No data yet": "لا توجد بيانات بعد", "Used %": "نسبة الاستخدام", "cancelled": "ملغي", "closed": "مغلق", "All customers": "كل العملاء", "Quick range": "نطاق سريع", "Last 30 days": "آخر 30 يوماً", "This month": "هذا الشهر", "This year": "هذه السنة", "All time": "كل الفترات", "Click a bar, slice or point to open the matching list": "اضغط على عمود أو شريحة أو نقطة لفتح القائمة المطابقة"};
{const q=new URLSearchParams(location.search).get('lang');if(['both','en','ar'].includes(q))localStorage.setItem('iom.lang',q)}
const LANG=localStorage.getItem('iom.lang')||'both';window.IOM_LANG=LANG;window.IOM_TR=t=>tr(t);
const keys=Object.keys(DICT).filter(k=>k.length>=4).sort((a,b)=>b.length-a.length);
const PATS=[[/^(\d+) rows?\b(.*)$/,(m)=>m[1]+' صفوف'+(m[2]?' '+m[2].replace('. Filters:','. المرشحات:'):'')],[/^(\d+) approved orders$/,m=>m[1]+' أوامر معتمدة'],[/^(\d+) invoices$/,m=>m[1]+' فواتير'],[/^(\d+) deliveries$/,m=>m[1]+' عمليات تسليم'],[/^([\d,\.]+) MT reserved$/,m=>m[1]+' طن محجوز'],[/^Receipt (\S+) is waiting for approval$/,m=>'الإيصال '+m[1]+' بانتظار الاعتماد'],[/^Production order (\S+) has actuals recorded and is waiting for approval$/,m=>'أمر الإنتاج '+m[1]+' سُجلت فعلياته وبانتظار الاعتماد']];
const wkeys=Object.keys(DICT).filter(k=>k.length>=4&&/^[A-Za-z]/.test(k)).sort((a,b)=>b.length-a.length);
const wre=wkeys.length?new RegExp('(?<![A-Za-z])('+wkeys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![A-Za-z])','g'):null;
function fin(o){return o.replace(/(\d[\d,\.]*)\s*MT\b/g,'$1 طن').replace(/\bavailable\b/g,'متاح').replace(/\bincoming \(receipts awaiting approval\)/g,'القادم (إيصالات بانتظار الاعتماد)').replace(/\bany\b/g,'أي').replace(/ to /g,' إلى ')}
function tr(t){const k=t.trim();if(!k)return null;if(DICT[k])return DICT[k];
 for(const[p,f]of PATS){const m=k.match(p);if(m)return fin(f(m))}
 let out=null;const lead=t.trimStart();
 for(const key of keys){if(lead.startsWith(key)){const rest=lead.slice(key.length);if(rest===''||/^[^A-Za-z]/.test(rest)){out=DICT[key]+rest;break}}}
 if(out===null)out=k;
 if(wre){out=out.replace(wre,x=>DICT[x])}
 out=fin(out);return out===k?null:out}
document.documentElement.lang=LANG==='ar'?'ar':'en';
document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
document.title=LANG==='ar'?DICT['Integrated Operations Management']:(LANG==='both'?'Integrated Operations Management | '+DICT['Integrated Operations Management']:document.title);
const seen=new WeakSet();
function inlineParent(el){return /^(BUTTON|A|OPTION|TD|SMALL|LABEL|SPAN|B)$/.test(el.tagName)&&!el.matches('.kpi .l,.kpi .n,.tag')?true:false}
function textNode(n){
 if(seen.has(n))return;const p=n.parentNode;if(!p||p.nodeType!==1)return;
 if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName)||p.closest('.ar')||p.closest('#lang'))return;
 const a=tr(n.nodeValue);if(!a)return;seen.add(n);
 if(LANG==='ar'){n.nodeValue=n.nodeValue.replace(n.nodeValue.trim(),a);return}
 if(p.tagName==='OPTION'){return}
 const sp=document.createElement('span');sp.className='ar '+((p.tagName==='BUTTON'||p.tagName==='A'||p.tagName==='TD'||p.tagName==='SMALL'||p.tagName==='SPAN')?'i':'b');sp.textContent=a;
 if(p.tagName==='TD'&&sp.className.includes('i')){sp.className='ar b'}
 n.parentNode.insertBefore(sp,n.nextSibling)}
function opt(o){if(o.dataset.t)return;const a=tr(o.textContent);if(!a)return;o.dataset.t=1;o.textContent=LANG==='ar'?a:o.textContent+' / '+a}
function attrs(el){['placeholder','title'].forEach(at=>{if(el.getAttribute&&el.getAttribute(at)&&!el.dataset['t'+at]){const a=tr(el.getAttribute(at));if(a){el.dataset['t'+at]=1;el.setAttribute(at,LANG==='ar'?a:el.getAttribute(at)+' / '+a)}}})}
function walk(root){
 if(root.nodeType===3){textNode(root);return}
 if(root.nodeType!==1||root.closest&&root.closest('.ar'))return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(textNode);
 root.querySelectorAll&&root.querySelectorAll('option').forEach(opt);if(root.tagName==='OPTION')opt(root);
 attrs(root);root.querySelectorAll&&root.querySelectorAll('[placeholder],[title]').forEach(attrs)}
let busy=false;
const mo=new MutationObserver(ms=>{if(busy)return;busy=true;try{for(const m of ms)m.addedNodes.forEach(n=>walk(n))}finally{busy=false;mo.takeRecords()}});
function langSel(){const top=document.querySelector('.top');if(!top||document.getElementById('lang'))return;
 const s=document.createElement('select');s.id='lang';s.title='Language / اللغة';
 s.innerHTML='<option value="both">English + العربية</option><option value="en">English</option><option value="ar">العربية</option>';s.value=LANG;
 s.onchange=()=>{localStorage.setItem('iom.lang',s.value);location.reload()};
 top.appendChild(s)}
function start(){langSel();if(LANG!=='en'){walk(document.body);mo.observe(document.body,{childList:true,subtree:true})}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(start,0));else setTimeout(start,0);
})();
